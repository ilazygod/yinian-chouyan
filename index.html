<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>意念抽烟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#08090b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
body{touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:
 radial-gradient(ellipse at 50% 73%,rgba(120,128,138,.07),transparent 34%),
 linear-gradient(#111318,#07080a 72%)}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
header{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
h1{font-size:18px;letter-spacing:.22em;margin:0 0 8px;font-weight:700}
#state{font-size:12px;opacity:.58;line-height:1.55}
.controls{position:absolute;z-index:8;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{height:48px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.065);color:#fff;font-size:13px;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button:active{transform:scale(.985);background:rgba(255,255,255,.1)}
#inhale{grid-column:1/4;height:58px;font-size:17px}
#ignite{grid-column:1/4;height:54px;font-size:16px}
.note{position:absolute;z-index:5;left:0;right:0;bottom:calc(178px + env(safe-area-inset-bottom));text-align:center;font-size:11px;opacity:.36;pointer-events:none}
.progress{position:absolute;z-index:5;left:50%;bottom:calc(207px + env(safe-area-inset-bottom));transform:translateX(-50%);height:3px;width:min(58vw,240px);background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
#bar{height:100%;width:0;background:rgba(255,255,255,.65)}
.badge{position:absolute;z-index:6;right:14px;top:max(18px,env(safe-area-inset-top));font-size:10px;opacity:.34}
.match-guide{position:absolute;z-index:7;pointer-events:none;right:16px;left:auto;top:18%;width:78px;height:42%;border:1px dashed rgba(255,255,255,.16);border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;letter-spacing:.04em;writing-mode:vertical-rl;color:rgba(255,255,255,.5);background:rgba(255,255,255,.018);user-select:none;-webkit-user-select:none}
.match-guide.ready{color:rgba(255,210,125,.8);border-color:rgba(255,180,80,.3)}
.match-guide.hidden{opacity:0;pointer-events:none}
.match-guide::before{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:3px;transform:translateX(-50%);border-radius:3px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.18) 0 5px,rgba(255,255,255,.04) 5px 10px)}
.match-guide::after{content:"↑  上下划  ↓";position:absolute;right:100%;margin-right:8px;top:50%;transform:translateY(-50%);writing-mode:horizontal-tb;white-space:nowrap;font-size:11px;color:rgba(255,255,255,.34)}
#strikeMeter{position:absolute;z-index:8;right:102px;top:32%;width:5px;height:110px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;pointer-events:none}
#strikeFill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(to top,#ff6a2b,#ffd66d);transition:height .03s linear}

/* v20: title + scene-selection shell. Core v18 smoking UI/interaction is untouched. */

#titleScreen{
 position:fixed;inset:0;z-index:90;
 display:flex;align-items:center;justify-content:center;
 background:#050608;color:#fff;
 opacity:1;transition:opacity .34s ease;
}
#titleScreen.fade{opacity:0;pointer-events:none}
#titleScreen.hide{display:none}
.titleInner{
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:28px;transform:translateY(-2vh);
}
.gameTitle{
 font-size:clamp(44px,13vw,72px);
 font-weight:700;letter-spacing:.08em;
 line-height:1;
}
#startGame{
 min-width:150px;height:48px;padding:0 26px;
 border-radius:999px;
 border:1px solid rgba(255,255,255,.22);
 background:rgba(255,255,255,.10);
 color:#fff;font-size:16px;font-weight:600;
 letter-spacing:.08em;
}
#startGame:active{transform:scale(.98)}
#sceneSelect{display:none}
#sceneSelect.show{display:flex}

#sceneBg{
 position:absolute;inset:0;z-index:0;
 background-position:center center;background-repeat:no-repeat;background-size:cover;
 opacity:0;transition:opacity .32s ease;
}
#sceneBg.on{opacity:1}
#sceneBg::after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to bottom,rgba(3,4,6,.18),rgba(3,4,6,.03) 45%,rgba(3,4,6,.20));
}
#sceneSelect{
 position:fixed;inset:0;z-index:60;display:flex;background:#050608;
 overflow:hidden;touch-action:manipulation;
}
#sceneSelect.done{pointer-events:none}
.sceneChoice{
 position:relative;flex:1 1 33.333%;min-width:0;height:100%;padding:0;border:0;border-radius:0;
 overflow:hidden;background:#111;transition:flex .52s cubic-bezier(.2,.82,.2,1),opacity .34s ease;
 backdrop-filter:none;-webkit-backdrop-filter:none;
}
.sceneChoice:active{transform:none;background:#111}
.sceneChoice img{
 position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
 pointer-events:none;user-select:none;-webkit-user-drag:none;
}
.sceneChoice::after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,0) 58%,rgba(0,0,0,.22));
 pointer-events:none;
}
.sceneChoice + .sceneChoice{border-left:2px solid rgba(255,255,255,.90)}
#sceneSelect .tapHint{
 position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
 transform:translateX(-50%);z-index:2;white-space:nowrap;
 font-size:11px;font-weight:600;letter-spacing:.08em;
 padding:7px 10px;border-radius:999px;color:rgba(255,255,255,.88);
 background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);
 pointer-events:none;transition:opacity .18s ease;
}
#sceneSelect.expanding .sceneChoice{opacity:0}
#sceneSelect.expanding .sceneChoice.chosen{flex-basis:100%;flex-grow:1;opacity:1;border-left:0}
#sceneSelect.expanding .sceneChoice.chosen .tapHint{opacity:0}
#sceneSelect.fade{opacity:0;transition:opacity .26s ease}


/* Safe UI cleanup: retain strike DOM/logic, only hide visual meter. */
#strikeMeter{display:none !important;}

/* v23: hide the smoking/burn progress UI only; logic remains intact. */
.progress{display:none!important}


/* v29 invisible interaction layer */
.controls{
  position:absolute !important;
  z-index:12 !important;
  left:0 !important; right:0 !important;
  bottom:0 !important;
  height:30vh !important;
  display:block !important;
  pointer-events:none !important;
}
#inhale,#puff{
  position:absolute !important;
  bottom:0 !important;
  height:28vh !important;
  width:50vw !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  color:transparent !important;
  opacity:0 !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  pointer-events:auto !important;
  -webkit-tap-highlight-color:transparent !important;
}
#inhale{left:0 !important;}
#puff{right:0 !important;left:auto !important;}
.note,.badge,.progress,#strikeMeter{
  display:none !important;
  visibility:hidden !important;
}
.match-guide{
  transition:opacity .78s ease, border-color .32s ease, color .32s ease, background .32s ease !important;
}
.match-guide.hidden{
  opacity:0 !important;
  pointer-events:none !important;
}

</style>

<style id="smokeDensityStyle">
#smokeFx{
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,.96) 24%,rgba(0,0,0,.78) 54%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.10) 100%);
  mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,.96) 24%,rgba(0,0,0,.78) 54%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.10) 100%);
}
</style>

<style>
/* v42 global smoke stats + compatibility-safe controls */
#globalStatsTitle{
  position:absolute;z-index:92;left:50%;transform:translateX(-50%);
  bottom:calc(34px + env(safe-area-inset-bottom));height:36px;padding:0 16px;
  border:1px solid rgba(255,255,255,.13);border-radius:14px;
  background:rgba(255,255,255,.035);color:rgba(255,255,255,.62);
  font-size:12px;letter-spacing:.08em;
}
#globalStatsGame{
  display:none;position:absolute;z-index:24;right:12px;
  top:max(12px,env(safe-area-inset-top));height:30px;padding:0 11px;
  border:1px solid rgba(255,255,255,.14);border-radius:10px;
  background:rgba(5,6,8,.34);color:rgba(255,255,255,.72);
  font-size:11px;font-weight:650;letter-spacing:.04em;
}
#globalStatsPanel{
  display:none;position:absolute;inset:0;z-index:120;
  align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.58);padding:16px 12px calc(14px + env(safe-area-inset-bottom));
  box-sizing:border-box;
}
#globalStatsPanel.show{display:flex}
.gs-card{
  width:min(94vw,430px);max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;
  border:1px solid rgba(255,255,255,.13);border-radius:22px;
  background:rgba(13,14,17,.97);color:#f2f2f2;padding:18px;box-sizing:border-box;
  box-shadow:0 18px 60px rgba(0,0,0,.42);
}
.gs-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.gs-kicker{font-size:9px;letter-spacing:.22em;opacity:.38;margin-bottom:4px}
.gs-title{font-size:22px;font-weight:750;letter-spacing:.05em}
#globalStatsClose{
  width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:#fff;font-size:24px;line-height:36px;padding:0
}
.gs-status{font-size:11px;opacity:.48;margin:6px 0 14px;min-height:16px}
.gs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:17px}
.gs-metric{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.025)}
.gs-metric span{display:block;font-size:10px;opacity:.42;margin-bottom:4px}
.gs-metric b{font-size:23px;font-weight:760}
.gs-metric em{font-size:10px;font-style:normal;opacity:.38;margin-left:4px}
.gs-section{margin-top:14px}
.gs-section-title{font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:7px;opacity:.72}
.gs-list{border-top:1px solid rgba(255,255,255,.07)}
.gs-row{display:flex;align-items:center;min-height:42px;border-bottom:1px solid rgba(255,255,255,.06)}
.gs-rank{width:28px;font-size:11px;opacity:.32}
.gs-place{min-width:0;flex:1}
.gs-place b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-place span{display:block;font-size:9px;opacity:.34;margin-top:2px}
.gs-count{font-size:13px;font-weight:700}
.gs-count small{font-size:9px;opacity:.35;margin-left:3px}
.gs-empty{padding:15px 0;font-size:11px;opacity:.35}
.gs-foot{text-align:center;font-size:9px;opacity:.28;margin-top:15px;letter-spacing:.04em}
</style>

</head>
<body>


<div id="titleScreen" aria-label="游戏开始">
  <div class="titleInner">
    <div class="gameTitle">意念抽烟</div>
    <button id="startGame" type="button">来一根？</button>
  </div>
</div>

<div id="sceneSelect" aria-label="选择抽烟场景">
  <button class="sceneChoice" type="button" data-scene="meal" aria-label="饭后烟">
    <img alt="饭后烟：生活化饭局结束后的第一人称场景" src="assets/asset_01.jpg">
    <span class="tapHint">饭后烟</span>
  </button>
  <button class="sceneChoice" type="button" data-scene="social" aria-label="社交烟">
    <img alt="社交烟：白天天台与同事聊天的第一人称场景" src="assets/asset_02.jpg">
    <span class="tapHint">社交烟</span>
  </button>
  <button class="sceneChoice" type="button" data-scene="after" aria-label="事后烟">
    <img alt="事后烟：温暖卧室、被子中的第一人称场景" src="assets/asset_03.jpg">
    <span class="tapHint">事后烟</span>
  </button>
</div>

<div id="app">
<div id="sceneBg" aria-hidden="true"></div>
<button id="exitGame" type="button" aria-label="退出到标题">退出</button>
<canvas id="c"></canvas><img id="smokeFx" alt="" draggable="false" style="position:absolute;left:50%;bottom:-6%;width:72%;height:auto;transform:translateX(-50%);opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen;will-change:transform,opacity;" src="assets/asset_04.webp">
<header><h1>意念抽烟</h1><div id="state">未点燃 · 先点烟</div></header>
<div class="badge">v22 SAFE UI CLEANUP + V18 LOCKED CORE</div>
<div class="progress"><div id="bar"></div></div>
<div id="matchGuide" class="match-guide">划火柴 ↑↓</div><div id="strikeMeter"><div id="strikeFill"></div></div>
<div class="note">右侧上下划火柴 → 拖火苗到烟头 → 吸得越久，吐烟越多</div>
<div class="controls">
<button id="inhale">按住吸一口</button>
<button id="puff" style="grid-column:1/4">吐一口</button>
</div>
</div>

<div id="cigEnd" style="display:none;position:absolute;inset:0;z-index:30;align-items:center;justify-content:center;background:rgba(5,6,8,.46);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);">
  <div style="width:min(78vw,300px);padding:20px 18px;text-align:center;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(14,15,18,.90);">
    <div style="font-size:18px;font-weight:700;letter-spacing:.08em;margin-bottom:8px;">这根抽完了</div>
    <div id="endSub" style="font-size:12px;opacity:.55;margin-bottom:8px;">烟已经烧到滤嘴</div>
    <div id="endNet" style="min-height:18px;font-size:11px;line-height:1.45;opacity:.58;margin-bottom:12px;"></div>
    <button id="nextCig" style="width:100%;height:48px;">再抽一支</button>
  </div>

</div>

<button id="globalStatsTitle" type="button" aria-label="查看全球烟况">全球烟况</button>
<button id="globalStatsGame" type="button" aria-label="查看全球烟况">烟况</button>

<div id="globalStatsPanel" role="dialog" aria-modal="true" aria-label="全球烟况">
  <div class="gs-card">
    <div class="gs-head">
      <div>
        <div class="gs-kicker">GLOBAL SMOKE</div>
        <div class="gs-title">全球烟况</div>
      </div>
      <button id="globalStatsClose" type="button" aria-label="关闭全球烟况">×</button>
    </div>
    <div id="globalStatsStatus" class="gs-status">正在连接全球烟况……</div>
    <div class="gs-grid">
      <div class="gs-metric"><span>全球累计</span><b id="gsTotal">--</b><em>支</em></div>
      <div class="gs-metric"><span>今日</span><b id="gsToday">--</b><em>支</em></div>
      <div class="gs-metric"><span>今日烟民</span><b id="gsPlayers">--</b><em>人</em></div>
      <div class="gs-metric"><span>今日最长一口</span><b id="gsLongest">--</b><em>秒</em></div>
    </div>
    <div class="gs-section">
      <div class="gs-section-title">国家烟况</div>
      <div id="gsCountries" class="gs-list"><div class="gs-empty">暂无数据</div></div>
    </div>
    <div class="gs-section">
      <div class="gs-section-title">城市烟点</div>
      <div id="gsCities" class="gs-list"><div class="gs-empty">暂无数据</div></div>
    </div>
    <div class="gs-foot">匿名统计 · 不需要注册 · 不保存精确位置</div>
  </div>
</div>

<script>
(function () {
    var cv = document.getElementById('c'), ctx = cv.getContext('2d');
    var state = document.getElementById('state'), bar = document.getElementById('bar');
    var inhaleBtn = document.getElementById('inhale'), matchGuide = document.getElementById('matchGuide');
    var strikeMeter = document.getElementById('strikeMeter'), strikeFill = document.getElementById('strikeFill');
    var cigEnd = document.getElementById('cigEnd'), nextCig = document.getElementById('nextCig');
    var endSub = document.getElementById('endSub'), endNet = document.getElementById('endNet');
    var globalStatsTitle = document.getElementById('globalStatsTitle');
    var globalStatsGame = document.getElementById('globalStatsGame');
    var globalStatsPanel = document.getElementById('globalStatsPanel');
    var globalStatsClose = document.getElementById('globalStatsClose');
    var globalStatsStatus = document.getElementById('globalStatsStatus');
    var gsTotal = document.getElementById('gsTotal'), gsToday = document.getElementById('gsToday');
    var gsPlayers = document.getElementById('gsPlayers'), gsLongest = document.getElementById('gsLongest');
    var gsCountries = document.getElementById('gsCountries'), gsCities = document.getElementById('gsCities');
    var STATS_URL = 'https://fekvkrhwtovfbtdoqybu.supabase.co/functions/v1/smoke-stats';
    var longestPuffMs = 0, statsSubmitted = false;
    function getAnonClientId() {
        var key = 'yinian_smoke_client_v1';
        var id = '';
        try { id = localStorage.getItem(key) || ''; } catch (e) { id = ''; }
        if (id.length < 8) {
            id = 'smk_' + Date.now().toString(36) + '_' + Math.floor(Math.random() * 1000000000).toString(36);
            try { localStorage.setItem(key, id); } catch (e2) { }
        }
        return id;
    }
    function safeNumber(obj, names) {
        if (!obj) return 0;
        for (var i = 0; i < names.length; i++) {
            var v = Number(obj[names[i]]);
            if (isFinite(v)) return v;
        }
        return 0;
    }
    function safeText(obj, names, fallback) {
        if (!obj) return fallback || '';
        for (var i = 0; i < names.length; i++) {
            var v = obj[names[i]];
            if (v !== null && v !== undefined && String(v).length) return String(v);
        }
        return fallback || '';
    }
    function escText(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
        });
    }
    function xhrJson(method, url, body, done) {
        var x = new XMLHttpRequest();
        var finished = false;
        function finish(err, data) {
            if (finished) return;
            finished = true;
            done(err, data);
        }
        try {
            x.open(method, url, true);
            x.timeout = 6500;
            x.setRequestHeader('Content-Type', 'application/json');
            x.onreadystatechange = function () {
                if (x.readyState !== 4) return;
                if (x.status >= 200 && x.status < 300) {
                    try { finish(null, JSON.parse(x.responseText || '{}')); }
                    catch (e) { finish(e); }
                } else {
                    finish(new Error('http_' + x.status));
                }
            };
            x.onerror = function () { finish(new Error('network')); };
            x.ontimeout = function () { finish(new Error('timeout')); };
            x.send(body ? JSON.stringify(body) : null);
        } catch (err) {
            finish(err);
        }
    }
    function renderRankList(el, rows, type) {
        if (!rows || !rows.length) {
            el.innerHTML = '<div class="gs-empty">还没有足够的数据</div>';
            return;
        }
        var max = Math.min(rows.length, 8), out = '';
        for (var i = 0; i < max; i++) {
            var r = rows[i] || {};
            var name = type === 'country'
                ? safeText(r, ['country_name','country','name'], '未知地区')
                : safeText(r, ['city_name','city','name'], '未知城市');
            var parent = type === 'city' ? safeText(r, ['country_name','country'], '') : '';
            var count = safeNumber(r, ['cigarettes','count','smokes','total']);
            out += '<div class="gs-row"><div class="gs-rank">' + (i + 1) + '</div><div class="gs-place"><b>' +
                   escText(name) + '</b>' + (parent ? '<span>' + escText(parent) + '</span>' : '') +
                   '</div><div class="gs-count">' + Math.round(count) + '<small>支</small></div></div>';
        }
        el.innerHTML = out;
    }
    function loadGlobalStats() {
        globalStatsStatus.textContent = '正在连接全球烟况……';
        xhrJson('GET', STATS_URL, null, function (err, data) {
            if (err || !data || !data.ok) {
                globalStatsStatus.textContent = '全球烟况暂时连不上 · 不影响继续抽';
                return;
            }
            var s = data.summary || {};
            var total = safeNumber(s, ['total_cigarettes','all_cigarettes','total','cigarettes']);
            var today = safeNumber(s, ['today_cigarettes','cigarettes_today','today']);
            var players = safeNumber(s, ['today_players','players_today','unique_players','players']);
            var longest = safeNumber(s, ['today_longest_puff_ms','longest_puff_ms','longest_puff']);
            gsTotal.textContent = Math.round(total);
            gsToday.textContent = Math.round(today);
            gsPlayers.textContent = Math.round(players);
            gsLongest.textContent = longest > 0 ? (longest / 1000).toFixed(1) : '--';
            renderRankList(gsCountries, data.countries || [], 'country');
            renderRankList(gsCities, data.cities || [], 'city');
            globalStatsStatus.textContent = '正在发生 · 数据来自匿名玩家';
        });
    }
    function openGlobalStats(e) {
        if (e && e.preventDefault) e.preventDefault();
        globalStatsPanel.className = 'show';
        loadGlobalStats();
    }
    function closeGlobalStats(e) {
        if (e && e.preventDefault) e.preventDefault();
        globalStatsPanel.className = '';
    }
    globalStatsTitle.addEventListener('click', openGlobalStats);
